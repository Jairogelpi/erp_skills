name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # astral-sh/setup-uv v5.4.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.11.19"
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make coverage
      - run: make validate-dataset
      - run: make benchmark-smoke
      - run: make verify-freeze
      - run: make experiment
      - run: make validate-claims
      # v2.1 (docs/tfm-closure-no-human-v2.1.md, Task 12 step 3): both
      # non-consuming -- mutation-v2-1 re-proves the evaluator's own
      # targeted-mutation report against the committed source (its
      # failing_tests capture is node-ID-only now, not the platform-
      # dependent truncated pytest summary line -- docs/audit.md #16),
      # and verify-tfm-closure (--final, docs/audit.md #17) verifies the
      # real completed campaign's closure -- protocol/generator/oracle/
      # evaluator/catalog/prompt/provider/analysis component hashes, the
      # committed power artifact, and the RUN_COMPLETED report's claim
      # language, all read-only. Neither calls a real LLM provider or
      # generates/consumes a holdout.
      - run: make mutation-v2-1
      - run: make verify-tfm-closure
      - run: make build
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-artifacts
          path: |
            data/bench_v1.jsonl
            data/bench_v1_wiring_report.json
            data/experiment_results.json
            data/experiment_results_observations_*.jsonl
            data/evidence_registry.json
            data/freeze_manifest.json
          retention-days: 14

# Odoo 19 adapter and dashboard artifacts are post-core extensions
# (CLAUDE.md sections 26, 31); they never gate this workflow.
