---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # astral-sh/setup-uv v5.4.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.11.19"
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make coverage
      - run: make build
      # actions/github-script v8.0.0
      - name: Create GitHub Release and upload distributions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const tag = context.ref.replace("refs/tags/", "");
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });

            for (const filename of fs.readdirSync("dist")) {
              const artifact = path.join("dist", filename);
              if (fs.statSync(artifact).isFile()) {
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: filename,
                  data: fs.readFileSync(artifact),
                });
              }
            }
