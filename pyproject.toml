[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-agent-os"
version = "0.1.0"
description = "Deterministic, synthetic-only ERP Agent OS foundations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jairo Gelpi Moreno" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "sentence-transformers==5.6.1",
  "fastapi==0.121.2",
  "uvicorn==0.38.0",
  "sqlalchemy==2.0.51",
  "groq==0.37.1",
  "google-genai>=2.17.0",
  # v2.1 Task 5 (power_v2_1.py): vectorized Monte Carlo power simulation
  # and closed-form interval/beta computations. Already present
  # transitively via sentence-transformers; declared directly per the
  # v2.1 plan ("Do not rely on their current transitive installation").
  "numpy>=2,<3",
  "scipy>=1.18,<2",
]

[dependency-groups]
# Figures only. Deliberately NOT a default dependency and NOT in
# `dev`: historically, installing matplotlib into the environment
# mypy analyses triggered an internal mypy 1.15 crash ("unresolved
# placeholder type" while serializing its cache) that traced back to
# this project's numpy `follow_imports = "skip"` override. That
# override was removed (v2.1 Task 5, power_v2_1.py: numpy is now a
# real, directly-used, type-checked dependency, and mypy handles its
# own type stubs fine without skip) -- kept in its own group anyway,
# since figures still have no reason to be part of the default type-
# checked environment. `uv sync --group dev` covers CI; figures
# regenerate on demand with `uv sync --group figures`.
figures = [
  "matplotlib>=3.11,<4",
]

dev = [
  "build==1.2.2.post1",
  "httpx==0.28.1",
  "hypothesis==6.123.7",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.11.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".atl",
  ".benchmarks",
  ".mcp/local",
  ".pi",
  ".pi-subagents",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Beyond the pycodestyle/pyflakes/isort core: pyupgrade (UP), bugbear
# (B), simplify (SIM), comprehensions (C4), blind-except (BLE), flake8
# -pie (PIE), return (RET), pathlib (PTH), tidy-imports (TID) and ruff's
# own checks (RUF).
#
# BLE in particular was already *assumed* enabled by the codebase: a
# dozen `# noqa: BLE001` directives sat inert across the LLM clients and
# scripts because the rule had never been selected. Turning it on makes
# those suppressions mean what they say and catches the blind excepts
# that were not suppressed -- one of which let scripts/demo_completa.py
# report "R4 rechazada" for any failure whatsoever.
#
# Deliberately NOT selected:
#   PERF -- PERF401 pushes readable `if ...: errors.append(...)`
#           validation loops into `list.extend` comprehensions. It is a
#           micro-optimisation in code that runs once, paid for in
#           clarity.
#   ARG  -- unused arguments are load-bearing here: postcondition and
#           precondition checks share one `(erp, output)` signature, so
#           an implementation that ignores one of them is conforming to
#           the contract, not carrying dead weight.
select = [
  "E", "F", "I", "UP", "B", "SIM", "C4", "BLE", "PIE", "RET", "PTH", "TID", "RUF",
]
# RUF001/002/003 flag "ambiguous" Unicode: en dashes, minus signs and
# multiplication signs. This project's prose, docstrings and figure
# labels are Spanish and use them correctly -- the fix would be to
# degrade the typography.
ignore = ["RUF001", "RUF002", "RUF003"]

# The 25 files listed in erp_agent_os.freeze_v2_1.COMPONENT_FILES and
# analyze_confirmatory_v2_1.ANALYSIS_CODE_FILES are hashed byte-for-byte
# into the frozen v2.1 manifest and into every table of the published
# confirmatory report. Editing one -- even to satisfy a linter, even to
# change a comment -- breaks `verify_code_freeze` and invalidates the
# 21,478-observation campaign. These are the rules the frozen files
# happen to trip; they are suppressed here rather than "fixed", and the
# suppressions must not be extended to any unfrozen file.
[tool.ruff.lint.per-file-ignores]
"scripts/run_targeted_mutations_v2_1.py" = ["RET504"]
"src/erp_agent_os/audit_reconstruction.py" = ["UP038"]
"src/erp_agent_os/experiment_v2_1.py" = ["BLE001", "RUF100", "SIM105"]
"src/erp_agent_os/scenarios_v2_1.py" = ["SIM201"]

[tool.mypy]
python_version = "3.12"
# `scripts` is checked alongside `src`: the scripts are what actually
# produce the published artifacts (the confirmatory report, the figures,
# the evaluation JSONs), so a type error there corrupts a number rather
# than merely a helper. Extending coverage to them caught a real latent
# bug -- odoo_governed_demo dereferenced `SystemCResult.execution`
# guarded by `selected_skill_id`, which is None on every non-executing
# decision.
files = ["src", "scripts"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Both are deliberately absent from the type-checked environment, so
# mypy must treat them as untyped rather than as missing:
#   pandas     -- optional Parquet export path only; the CSV is the
#                 RF-18 deliverable and pandas is not a dependency.
#   matplotlib -- lives in the `figures` group, not `dev`, for the
#                 reason documented above that group. CI syncs `dev`
#                 only, so scripts/make_figures*.py import a module
#                 that is genuinely not installed there.
module = ["pandas.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Byte-frozen (ANALYSIS_CODE_FILES): its hash is embedded in every table
# of the published confirmatory report, so the one `object` -> `str |
# None` narrowing it needs cannot be annotated away without invalidating
# the campaign. Suppressed at the config level, leaving the file itself
# untouched.
module = ["analyze_confirmatory_v2_1"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
